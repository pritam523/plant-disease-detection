name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke-tests:
    name: Python 3.12 smoke tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify local files and configuration
        run: python run.py check

      - name: Run automated smoke tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          # CI-only admin hash for the smoke-test password. Not a real credential.
          ADMIN_PASSWORD_HASH: pbkdf2_sha256$210000$6d6b9e5937bce7d2765bc574d383731b$3190e8fdeb5b02c6aea3532924eb47ba403301e23f2572a124b7e46b9a74c2cf
          ADMIN_SECRET_KEY: ci-only-session-secret-not-for-deployment
